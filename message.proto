syntax = "proto3";

enum MSG_TYPE {
  UNKNOWN = 0;
  REQUEST = 1;
  REPLY = 2;
  PROGRESS = 3;
}

message Header {
  int64 msg_id = 1;
  string client_id = 2;
}

message Response {
  MSG_TYPE type = 1;
  bool error = 2;
  string description = 3;
}

message Message {
  oneof type {
    System state = 3;
    LongRunning long = 4;
    Command cmd = 5;
  }
}

message System {
  int64 serial = 1;
  string version = 2;
}

message LongRunning {
  string info = 1;
}

message Command {
  bool enable = 1;
}


